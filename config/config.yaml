# Parameters for the sas_kuka_control_template nodes.
#
# Each top-level block is keyed by the ROS node name and is loaded by the
# corresponding launch file via its `config_file` argument.
#
# The `kuka_1` block configures the `sas_robot_driver_kuka_node` started by
# `sas_robot_driver_kuka/robot_launch.py` (see that package for the full
# parameter list).

# sas_robot_driver_kuka_node
kuka_1:
  ros__parameters:
    joint_limits_min: [-170.0, -120.0, -170.0, -120.0, -170.0, -120.0, -175.0]
    joint_limits_max: [170.0, 120.0, 170.0, 120.0, 170.0, 120.0, 175.0]
    thread_sampling_time_sec: 0.001  # Robot thread is at 1000 Hz

# joint_interface_example.py (robot_example_py_launch.py)
sas_kuka_control_template_joint_interface_example:
  ros__parameters:
    robot_topic_name: "kuka_1"

# joint_interface_example.py (simulation_v2_example_py_launch.py)
sas_kuka_control_template_joint_interface_example_py:
  ros__parameters:
    robot_topic_name: "kuka_1_sim"

# kinematic_control.py (simulation_v2_kinematic_control_py_launch.py)
sas_kuka_control_template_kinematic_control:
  ros__parameters:
    robot_topic_name: "kuka_1_sim"
    xd_topic_name: "/frame_xd"

# topic_tools relay (robot_and_simulation_v2_example_py_launch.py)
kuka_1_relay:
  ros__parameters:
    input_topic: "/kuka_1_sim/set/target_joint_positions"
    output_topic: "/kuka_1/set/target_joint_positions"
